# Этот workflow загружает Python-пакет в PyPI при создании релиза
# Подробнее: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# В этом workflow используются actions, не сертифицированные GitHub.
# Они предоставлены сторонними разработчиками и регулируются
# отдельными условиями использования, политикой конфиденциальности
# и документацией по поддержке.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          # ПРИМЕЧАНИЕ: добавьте сюда свои шаги сборки дистрибутива.
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # ВАЖНО: это разрешение обязательно для trusted publishing
      id-token: write

    # Настоятельно рекомендуется использовать отдельные окружения с защитой для публикации.
    # Подробнее: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # НЕОБЯЗАТЕЛЬНО: раскомментируйте и обновите, чтобы добавить URL проекта PyPI в статус деплоя:
      # ссылка: https://pypi.org/p/ВАШ_ПРОЕКТ
      #
      # АЛЬТЕРНАТИВА: если имя GitHub Release совпадает со строкой версии проекта PyPI
      # АЛЬТЕРНАТИВА: в таком случае раскомментируйте следующую строку:
      # ссылка: https://pypi.org/project/ВАШ_ПРОЕКТ/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
